spring:
  application:
    name: facecook-be
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/facecook}
    username: ${DB_USERNAME:facecook}
    password: ${DB_PASSWORD:local-dev-password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true

server:
  port: 8080
