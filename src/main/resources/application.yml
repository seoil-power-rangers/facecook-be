spring:
  application:
    name: facecook-be
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/facecook}
    username: ${DB_USERNAME:facecook}
    password: ${DB_PASSWORD:local-dev-password}
    hikari:
      # DB가 기본값(CURRENT_TIMESTAMP)으로 채우는 시각 컬럼(profile.created_at 등)도 한국 시간으로
      # 저장되게 연결마다 세션 시간대를 맞춘다. 코드가 만드는 시각은 EventTime이 한국 시간으로 만든다.
      # 시각 컬럼이 전부 DATETIME이라 이미 저장된 값이나 애플리케이션이 넣는 값은 이 설정으로
      # 바뀌지 않는다. 한국은 서머타임이 없어 고정 오프셋으로 충분하다.
      connection-init-sql: "SET time_zone = '+09:00'"
      # 서버당 DB 연결 수. 참가자 900명 부하테스트에서 기본값 10개가 모두 쓰여 요청이 연결을 기다렸다(#129).
      # 서버 2대 × 20개 = 40개로 RDS 최대 연결 수(60개) 안에 둔다. 서버를 늘리면 합계가 60을 넘지 않게 함께 줄인다.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      # 한가할 때 열어 두는 연결 수. 나머지는 몰릴 때만 열고, 한가해지면 닫혀 RDS 메모리를 덜 쓴다.
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  flyway:
    enabled: true

management:
  health:
    mail:
      # ALB 헬스체크(/actuator/health)가 SMTP(Brevo) 연결 상태까지 반영하지 않게 제외한다.
      # 메일 발송 실패는 회원가입 인증 흐름에만 영향을 주고, 서버 자체가 죽은 건 아니다.
      enabled: false

app:
  cook:
    # 받은 콕 거절 API 활성화. 꺼져 있어도 이미 저장된 거절 상태는 읽고 처리한다(facecook-be#74).
    reject-enabled: ${COOK_REJECT_ENABLED:false}
  chat:
    open-time: ${CHAT_OPEN_TIME:09:00}
    close-time: ${CHAT_CLOSE_TIME:18:00}
  mail:
    from: ${SMTP_FROM:${SMTP_USER:}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  session:
    secret: ${SESSION_SECRET}
    cookie-name: ${SESSION_COOKIE_NAME:FACECOOK_SESSION}
    max-age-seconds: ${SESSION_MAX_AGE_SECONDS:604800}
    secure: ${SESSION_COOKIE_SECURE:false}
    same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
    domain: ${SESSION_COOKIE_DOMAIN:}
  push:
    vapid:
      public-key: ${VAPID_PUBLIC_KEY:}
      private-key: ${VAPID_PRIVATE_KEY:}
  super-account:
    login: ${SUPER_ACCOUNT_LOGIN:}
    password: ${SUPER_ACCOUNT_PASSWORD:}
  admin:
    stats:
      # LAST_ACTIVE_TODAY counts users whose last_active_at is on the current Asia/Seoul date.
      # Set STATUS to count every non-suspended user instead.
      active-user-criterion: ${ADMIN_STATS_ACTIVE_USER_CRITERION:LAST_ACTIVE_TODAY}
  s3:
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    # 비워두면 버킷·리전으로 가상 호스팅 방식 URL을 만든다. CloudFront 등을
    # 앞단에 두게 되면 그 도메인으로 덮어쓴다.
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    presign-ttl-seconds: ${S3_PRESIGN_TTL_SECONDS:300}
  profile:
    activity:
      active-window-minutes: ${PROFILE_ACTIVE_WINDOW_MINUTES:15}
  logging:
    slow-request:
      threshold-ms: ${SLOW_REQUEST_THRESHOLD_MS:500}

server:
  port: 8080
  # JSON 응답을 gzip으로 압축한다(클라이언트가 Accept-Encoding: gzip을 보낼 때만, 2KB 이상인 응답만).
  # 참가자 900명 기준 GET /api/profiles가 압축 없이 약 244KB였다(#125).
  compression:
    enabled: true
    mime-types: application/json
  # 배포(docker stop)의 SIGTERM에 진행 중인 요청을 마치고, WebSocket 세션을 닫아 연결 종료 이벤트가
  # 나게 한다(그래야 접속 기록이 바로 지워진다, #81). Boot 3.4 기본값이지만 배포 스크립트가 여기에
  # 기대므로 명시한다. 종료 대기는 docker stop 타임아웃(30초)보다 짧게 둔다.
  shutdown: graceful
