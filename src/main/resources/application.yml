spring:
  application:
    name: facecook-be
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/facecook}
    username: ${DB_USERNAME:facecook}
    password: ${DB_PASSWORD:local-dev-password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  flyway:
    enabled: true

app:
  mail:
    from: ${SMTP_FROM:${SMTP_USER:}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

server:
  port: 8080
