spring:
  application:
    name: facecook-be
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/facecook}
    username: ${DB_USERNAME:facecook}
    password: ${DB_PASSWORD:local-dev-password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  flyway:
    enabled: true

management:
  health:
    mail:
      # ALB 헬스체크(/actuator/health)가 SMTP(Brevo) 연결 상태까지 반영하지 않게 제외한다.
      # 메일 발송 실패는 회원가입 인증 흐름에만 영향을 주고, 서버 자체가 죽은 건 아니다.
      enabled: false

app:
  chat:
    open-time: ${CHAT_OPEN_TIME:09:00}
    close-time: ${CHAT_CLOSE_TIME:18:00}
  mail:
    from: ${SMTP_FROM:${SMTP_USER:}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  session:
    secret: ${SESSION_SECRET}
    cookie-name: ${SESSION_COOKIE_NAME:FACECOOK_SESSION}
    max-age-seconds: ${SESSION_MAX_AGE_SECONDS:604800}
    secure: ${SESSION_COOKIE_SECURE:false}
    same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
    domain: ${SESSION_COOKIE_DOMAIN:}
  push:
    vapid:
      public-key: ${VAPID_PUBLIC_KEY:}
      private-key: ${VAPID_PRIVATE_KEY:}
  super-account:
    login: ${SUPER_ACCOUNT_LOGIN:rhgustjrwkwlxjf}
    password: ${SUPER_ACCOUNT_PASSWORD:dlwlalsqhwlxjf}
  admin:
    stats:
      # STATUS is the default until last_active_at is updated by user activity.
      # Set LAST_ACTIVE_TODAY to count activity for the current Asia/Seoul date.
      active-user-criterion: ${ADMIN_STATS_ACTIVE_USER_CRITERION:STATUS}
  s3:
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    # 비워두면 버킷·리전으로 가상 호스팅 방식 URL을 만든다. CloudFront 등을
    # 앞단에 두게 되면 그 도메인으로 덮어쓴다.
    public-base-url: ${S3_PUBLIC_BASE_URL:}
    presign-ttl-seconds: ${S3_PRESIGN_TTL_SECONDS:300}
  profile:
    activity:
      active-window-minutes: ${PROFILE_ACTIVE_WINDOW_MINUTES:15}
  logging:
    slow-request:
      threshold-ms: ${SLOW_REQUEST_THRESHOLD_MS:500}

server:
  port: 8080
