services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: facecook
      MYSQL_USER: facecook
      MYSQL_PASSWORD: local-dev-password
      MYSQL_ROOT_PASSWORD: local-dev-root-password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  mysql-data:
