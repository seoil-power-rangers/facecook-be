name: Deploy to EC2

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # t4g EC2 인스턴스가 Arm64라 이미지도 Arm64로 빌드해야 한다 (QEMU로 크로스 빌드).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.ECR_REPOSITORY }}:latest
            ${{ secrets.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha_short }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get in-service instance IDs from ASG
        id: instances
        run: |
          IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ secrets.ASG_NAME }}" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

      - name: Get target group ARN
        id: tg
        run: |
          ARN=$(aws elbv2 describe-target-groups --names facecook-tg --query 'TargetGroups[0].TargetGroupArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      # 서버1 배포 → 헬스체크 통과 확인 → 서버2 배포 (순차 롤링, §2 확정 설계).
      - name: Sequential rolling deploy via SSM
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TG_ARN: ${{ steps.tg.outputs.arn }}
        run: |
          set -e
          for ID in ${{ steps.instances.outputs.ids }}; do
            echo "=== Deploying to $ID ==="

            COMMANDS_JSON=$(jq -n --arg ecr "$ECR_REPOSITORY" --arg region "$AWS_REGION" '{
              commands: [
                "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($ecr)",
                "docker pull \($ecr):latest",
                "docker rm -f facecook-app || true",
                "docker run -d --name facecook-app --restart unless-stopped --env-file /opt/facecook/app.env -p 8080:8080 \($ecr):latest"
              ]
            }')

            CMD_ID=$(aws ssm send-command \
              --instance-ids "$ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "$COMMANDS_JSON" \
              --query 'Command.CommandId' --output text)

            aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$ID"

            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" --query 'Status' --output text)
            if [ "$STATUS" != "Success" ]; then
              echo "::error::$ID 배포 명령 실패 (status=$STATUS)"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" --query 'StandardErrorContent' --output text
              exit 1
            fi

            echo "Waiting for $ID to become healthy in target group..."
            HEALTHY=false
            for i in $(seq 1 30); do
              STATE=$(aws elbv2 describe-target-health --target-group-arn "$TG_ARN" \
                --targets Id="$ID" --query 'TargetHealthDescriptions[0].TargetHealth.State' --output text)
              echo "  [$i] $ID health: $STATE"
              if [ "$STATE" = "healthy" ]; then HEALTHY=true; break; fi
              sleep 10
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "::error::$ID 헬스체크 통과 실패, 배포 중단(다음 서버로 안 넘어감)"
              exit 1
            fi

            echo "=== $ID 정상 배포 완료 ==="
          done
