name: Test

# PR과 main 배포가 같은 테스트 집합(./gradlew check)을 실행하도록 재사용 워크플로로 둔다.
# deploy.yml은 이 워크플로를 먼저 호출하고, 통과한 뒤에만 이미지를 빌드·배포한다.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # check는 test를 포함한다. MySQL 통합 테스트는 Testcontainers로 Docker를 쓰는데,
      # Docker가 없으면 테스트를 건너뛰지 않고 실패하므로 조용히 통과하는 일이 없다.
      - name: Run tests
        run: ./gradlew clean check --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests
            build/test-results
